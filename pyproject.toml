[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airline-ops-platform"
version = "0.1.0"
description = "Airline operations data engineering project focused on BTS flight performance data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "psycopg[binary]>=3.2.0",
    "pyarrow>=15.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "dbt-postgres>=1.10.0,<2.0.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0",
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"airline_ops.warehouse" = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
